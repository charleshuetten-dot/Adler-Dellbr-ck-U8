<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Alle Dateien liegen im Wurzelverzeichnis; nur die Einstiegsseiten stehen in
     eigenen Ordnern, damit Trainer- und Eltern-App getrennte Manifest-Scopes haben.
     Ohne getrennte Scopes haelt Chrome beide fuer dieselbe App ("bereits installiert"). -->
<base href="../">
<meta name="theme-color" content="#1a56db">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="U9 I Adler">
<meta name="application-name" content="U9 I Adler">
<link rel="manifest" id="pwa-manifest" href="manifest-trainer.json">
<link rel="apple-touch-icon" id="apple-icon" href="icon-trainer.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielerprofil U9 I – SV Adler Dellbrück</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
<script>
// Nur-Lese-Ansichten bieten keine Installation an – sonst wuerde man von dort
// versehentlich die Trainer-App auf den Startbildschirm holen.
(function(){
  var p=new URLSearchParams(location.search);
  if(p.has("quiz")||p.has("heft")||p.has("ticker")||p.has("kind")||p.has("delegate")||p.has("match")){
    document.getElementById("pwa-manifest").remove();
  }
})();
</script>
</head>
<body>
<script>
/* Seitengeruest aus shell.html nachladen, dann die Skripte in genau der Reihenfolge
   wie frueher im <body>. Die Skripte haengen sich an DOMContentLoaded – das ist beim
   Nachladen laengst vorbei, deshalb loesen wir es am Ende einmal selbst aus. */
window.addEventListener("error",function(e){try{var d=document.getElementById("pin-diag");if(d&&!d.dataset.err&&d.textContent.indexOf("Bereit")!==0){d.dataset.err="1";d.style.color="#fecaca";d.textContent="⚠️ "+(e.message||"Skript-Fehler")+" – "+String(e.filename||"").split("/").pop()+":"+(e.lineno||"?");}}catch(_){}},true);
window.addEventListener("unhandledrejection",function(e){try{var m=String((e.reason&&e.reason.message)||e.reason||"");if(/Transition was aborted|AbortError|abort/i.test(m))return;var d=document.getElementById("pin-diag");if(d&&!d.dataset.err&&d.textContent.indexOf("Bereit")!==0){d.dataset.err="1";d.style.color="#fecaca";d.textContent="⚠️ "+(m||"Fehler").slice(0,120);}}catch(_){}});
window.pinNext=window.pinNext||function(el,n){if(el&&el.value.length===1){var x=document.getElementById("pin"+n);if(x)x.focus();}};
window.pinBack=window.pinBack||function(){};window.pinCheck=window.pinCheck||function(){};
(async function(){
  const shell=await (await fetch("shell.html")).text();
  document.body.insertAdjacentHTML("afterbegin",shell);
  // Haengt die Ladung (alter/kaputter Cache), bekommt der Nutzer nach 16 s einen
  // Reparatur-Knopf: Service Worker + Caches wegraeumen und frisch laden.
  setTimeout(function(){
    var d=document.getElementById("pin-diag");
    if(d&&d.textContent.indexOf("App lädt")===0&&!d.dataset.err){
      d.innerHTML='⚠️ Die App lädt nicht fertig. <button id="pin-repair" style="margin-left:6px;padding:6px 12px;border:none;border-radius:8px;background:#fff;color:#1e3a8a;font-weight:800;cursor:pointer;font-family:inherit">🔧 App reparieren</button>';
      document.getElementById("pin-repair").onclick=async function(){
        this.textContent="Repariere…";
        try{
          if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++)await rs[i].unregister();}
          if(window.caches){var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j]);}
        }catch(e){}
        location.reload();
      };
    }
  },16000);

  /* ZWEI-WELLEN-LADEN (Perf-Audit): Welle 1 (~940 KB) reicht fuer den ersten Screen –
     Kern + Views + Boot. Die 28 Feature-Module (~980 KB) kommen direkt danach, waehrend
     der Trainer schon die Startseite sieht. Alle Inits sind selbststartend
     (_adlerOnReady/readyState) – ein synthetisches DOMContentLoaded ist nicht mehr noetig. */
  const lade=(dateien)=>new Promise((fertig,fehler)=>{
    let offen=dateien.length;
    dateien.forEach(datei=>{
      const s=document.createElement("script");
      s.src=datei; s.async=false;               // parallel laden, in Reihenfolge ausfuehren
      s.onload=()=>{ if(--offen===0)fertig(); };
      s.onerror=()=>fehler(new Error(datei));
      document.body.appendChild(s);
    });
  });
  await lade(["data.js","core.js","engine.js","views.js","boot.js"]);
  lade(["quiz.js",
    "md-eltern-portal.js","md-abzeichen.js","md-carpool.js","md-fanfakten.js","md-teamkasse.js","md-kabine.js",
    "md-aufstellung.js","md-print.js","md-taktikboard.js","md-taktik-draw.js","md-taktik-video.js","md-kalender.js","md-gegner.js","md-turnierplan.js",
    "md-teams.js","md-matchuhr.js","md-liveticker.js","md-spielbericht.js",
    "md-matchcard.js","md-analyse.js","md-quests.js","md-voice.js",
    "md-live-vollbild.js","md-fundbuero.js","md-taktik-bib.js","md-ausruestung.js","md-galerie.js","md-kasse.js","md-ki-coach.js"
  ]).catch(e=>console.error("Welle 2:",e));
})().catch(e=>{
  console.error(e);
  document.body.innerHTML='<div style="font-family:system-ui;padding:32px;text-align:center;color:#334155">'
    +'<div style="font-size:40px">🦅</div><p>Die App konnte nicht geladen werden.<br>Bitte die Seite neu laden.</p></div>';
});
</script>
</body>
</html>
